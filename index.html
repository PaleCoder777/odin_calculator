<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Basic Calculator</h1>

    <section id="calculator">
        <div id="display"></div>

        <div id="calcBtns">
            <div class="calcRow">
                <button id="clear">Clear</button>
                <button></button>
                <button></button>
                <button id="dividedBy">/</button>
            </div>

            <div class="calcRow">
                <button id="sevenBtn">7</button>
                <button id="eightBtn">8</button>
                <button id="nineBtn">9</button>
                <button id="times">*</button>
            </div>

            <div class="calcRow">
                <button id="fourBtn">4</button>
                <button id="fiveBtn">5</button>
                <button id="sixBtn">6</button>
                <button id="minus">-</button>
            </div>

            <div class="calcRow">
                <button id="oneBtn">1</button>
                <button id="twoBtn">2</button>
                <button id="threeBtn">3</button>
                <button id="plus">+</button>
            </div>
        </div>

        <div id="equals">
            <button id="equalsBtn">=</button>
        </div>
    </section>
</body>
</html>
