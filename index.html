<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Basic Calculator</h1>

    <section id="calculator">
        <div id="display">Calculator Display here</div>

        <div id="calcBtns">
            <div class="calcRow">
                <button>Clear</button>
                <button></button>
                <button></button>
                <button>/</button>
            </div>

            <div class="calcRow">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>*</button>
            </div>

            <div class="calcRow">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>
            </div>

            <div class="calcRow">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>
            </div>
        </div>

        <div id="equals">
            <button id="equalsBtn">=</button>
        </div>
    </section>
</body>
</html>
